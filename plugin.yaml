name: vk
label: VK
kind: platform
version: 0.1.0
description: Адаптер VK-сообщества через Long Poll для Hermes Agent.
author: Alex / Hermes VK Adapter
requires_env:
  - name: VK_GROUP_TOKEN
    description: 'Токен VK-сообщества с правами messages/manage/docs/photos. Это не личный токен VK-пользователя. Перед вводом прочитай раздел README "Настройка VK".'
    prompt: Токен VK-сообщества
    url: https://github.com/aleksesipenko/hermes-vk-adapter#readme
    secret: true
    password: true
  - name: VK_GROUP_ID
    description: 'Положительный числовой id VK-сообщества, без минуса. Пример: club123456789 -> 123456789. Подробности в README, раздел "Настройка VK".'
    prompt: Числовой id VK-сообщества
    url: https://github.com/aleksesipenko/hermes-vk-adapter#readme
    secret: false
    password: false
optional_env:
  - name: VK_API_VERSION
    description: Версия VK API, по умолчанию 5.199
    prompt: Версия VK API
    secret: false
    password: false
  - name: VK_ALLOWED_USERS
    description: Числовые VK user id через запятую; только эти пользователи смогут писать Hermes
    prompt: Разрешённые VK user id
    secret: false
    password: false
  - name: VK_ALLOW_ALL_USERS
    description: Поставь true только для публичного тестирования
    prompt: Разрешить всех VK-пользователей
    secret: false
    password: false
  - name: VK_HOME_PEER_ID
    description: 'VK peer_id для cron/proactive-доставки. Для DM обычно совпадает с твоим числовым VK user id; для беседы смотри логи gateway.'
    prompt: Домашний VK peer_id
    secret: false
    password: false
  - name: VK_REQUIRE_MENTION
    description: Требовать mention/reply activation для обычного текста в групповых беседах
    prompt: Требовать mention в беседах
    secret: false
    password: false
  - name: VK_COMMAND_KEYBOARD
    description: Показывать постоянную VK-клавиатуру команд в обычных текстовых ответах
    prompt: Включить клавиатуру команд
    secret: false
    password: false
  - name: VK_POLL_WAIT_SECONDS
    description: Время ожидания VK Long Poll в секундах
    prompt: Таймаут Long Poll в секундах
    secret: false
    password: false
  - name: VK_MAX_MESSAGE_LENGTH
    description: Безопасный размер фрагмента исходящего сообщения
    prompt: Максимальная длина сообщения
    secret: false
    password: false
  - name: VK_DEBUG_UPDATES
    description: Логировать raw Long Poll updates для диагностики
    prompt: Диагностировать VK updates
    secret: false
    password: false
  - name: VK_REACTION_PROCESSING_ID
    description: 'Числовой id VK-реакции «в работе». По умолчанию выключено. Только число; эмодзи не подбираются автоматически.'
    prompt: Числовой id реакции «в работе»
    secret: false
    password: false
  - name: VK_REACTION_DONE_ID
    description: 'Числовой id VK-реакции «готово». Если не задан, реакция «в работе» просто снимается.'
    prompt: Числовой id реакции «готово»
    secret: false
    password: false
  - name: VK_DISABLE_MARK_READ
    description: 'Поставь true, чтобы не отмечать входящие сообщения прочитанными.'
    prompt: Отключить отметку о прочтении
    secret: false
    password: false
