[project]
name = "hermes-vk-adapter"
version = "0.2.0"
description = "Hermes Gateway platform adapter for VK community messages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "respx>=0.22,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor", ".venv", ".hermes-local"]

# Pinned explicitly: ruff's implicit default rule set changes between minor
# releases, so an unpinned `select` makes the same commit lint clean locally and
# fail in CI (or the reverse). These are the rules this repository actually
# enforces.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Hermes installs this plugin by copying/discovering the repository directory
# (`hermes plugins install <repo>`), not from a wheel. Nothing is packaged on
# purpose: `pip install -e ".[dev]"` exists only to provide the dev toolchain.
# Building a wheel would produce a dist-info-only artifact, which is why CI
# tests the real discovery path instead of a packaging smoke.
[tool.setuptools]
packages = []
